<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="brown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#704044"/>
      <stop offset="1" stop-color="#492426"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
