name: Qualitätsprüfung

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Tests, Migrationen und Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Abhängigkeiten auf hohe Sicherheitslücken prüfen
        run: npm audit --audit-level=high
      - run: npm run check:migrations
      - run: npm test
      - run: npm run build
