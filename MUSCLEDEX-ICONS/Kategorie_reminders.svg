<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" role="img" aria-labelledby="title desc">
  <title id="title">MUSCLEDEX Slab-Glocke</title>
  <desc id="desc">Farbige Glocke mit massiver schwarzer, nach rechts unten versetzter Schattenform.</desc>

  <!-- ECHTER SCHLAGSCHATTEN: eigener schwarzer Vektor, keine CSS-Filter. -->
  <g data-part="shadow" transform="translate(15 17)" fill="#000000" stroke="#000000" stroke-width="20" stroke-linejoin="round">
    <path d="M208 425c6 39 26 62 48 62s42-23 48-62Z"/>
    <path d="M160 316v-82c0-67 41-104 96-104s96 37 96 104v82c25 8 40 28 40 52v9c0 29-24 52-54 52H174c-30 0-54-23-54-52v-9c0-24 15-44 40-52Z"/>
  </g>

  <!-- VORDERFORM: fill kann später gegen jede Markenfarbe getauscht werden. -->
  <path data-part="clapper" d="M208 425c6 39 26 62 48 62s42-23 48-62Z"
        fill="#FFFFFF" stroke="#000000" stroke-width="20" stroke-linejoin="round"/>
  <path data-part="face" d="M160 316v-82c0-67 41-104 96-104s96 37 96 104v82c25 8 40 28 40 52v9c0 29-24 52-54 52H174c-30 0-54-23-54-52v-9c0-24 15-44 40-52Z"
        fill="#FFFFFF" stroke="#000000" stroke-width="20" stroke-linejoin="round"/>

  <!-- Kurzer Innenstrich wie bei der Referenzglocke. -->
  <path data-part="highlight" d="M205 245v-20c0-24 17-42 43-46"
        fill="none" stroke="#000000" stroke-width="20" stroke-linecap="round"/>
</svg>
