<svg width="100%" height="100%" viewBox="-1.5 2 103 98" xmlns="http://www.w3.org/2000/svg">
  <!-- Entwurf v4: v2 (mit der höheren, quadratischen Brille aus v3) als
       Umrisszeichnung: weiße Flächen, schwarze Linien, Haar und
       Schnauzbart schwarz gefüllt, keine Augen, keine Nase, kein Aufdruck. Außen die dicke Kontur wie bei den Menü-Icons. -->
  <defs>
    <path id="koerper" d="M36 70 C35 76 33 80 28 83 C20 86 12 89 6 95 L6 100 L94 100 L94 95 C88 89 80 86 72 83 C67 80 65 76 64 70 Z"/>
    <path id="gesicht" d="M27 24 L27 58 C27 72 37 81 50 81 C63 81 73 72 73 58 L73 24 Z"/>
    <path id="haare" d="M22 52 C20 44 20 33 24 25 C29 16 39 12 50 12 C62 12 72 16 76.5 24 C80 31 80 42 78 52 L73 52 L73 36 C70 33 66 31.5 61 31 C56 30.5 50 31 45 29.5 C41 28.3 38 26 36.5 23.5 C34 26 31 28.5 28.5 31 C27.6 32 27 33.5 27 35 L27 52 Z"/>
  </defs>
  <g fill="#000" stroke="#000" stroke-width="13" stroke-linejoin="round">
    <use href="#koerper"/>
    <circle cx="25.5" cy="55" r="6"/>
    <circle cx="74.5" cy="55" r="6"/>
    <use href="#gesicht"/>
    <use href="#haare"/>
  </g>

  <g fill="#FFFFFF" stroke="#000" stroke-width="4.2" stroke-linejoin="round" stroke-linecap="round">
    <use href="#koerper"/>
    <circle cx="25.5" cy="55" r="6"/>
    <circle cx="74.5" cy="55" r="6"/>
    <use href="#gesicht"/>
  </g>
  <!-- Haar schwarz gefüllt, Scheitel und Welle als weiße Linien -->
  <use href="#haare" fill="#000"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round">
    <path d="M36.5 22.5 C38 18 41 15 45 14"/>
    <path d="M40 22 C48 19 60 20 70 26"/>
  </g>

  <g fill="none" stroke="#000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Halsausschnitt -->
    <path d="M28 84 C33 90.5 67 90.5 72 84"/>
    <!-- Brauen -->
    <path d="M33.5 39.3 L45 39.6"/>
    <path d="M66.5 39.3 L55 39.6"/>
  </g>

  <!-- Brille in mittlerer Höhe mit kräftigem oberem Rand -->
  <g fill="#FFFFFF" stroke="#000" stroke-linejoin="round" stroke-linecap="round">
    <rect x="31" y="41.5" width="17" height="14" rx="2.6" stroke-width="4"/>
    <rect x="52" y="41.5" width="17" height="14" rx="2.6" stroke-width="4"/>
    <path d="M31.5 41.6 L47.5 41.6 M52.5 41.6 L68.5 41.6" fill="none" stroke-width="5.4"/>
    <path d="M48 45.5 C49.2 44.3 50.8 44.3 52 45.5" fill="none" stroke-width="2.6"/>
    <path d="M31 43.5 L26.5 44 M69 43.5 L73.5 44" fill="none" stroke-width="2.6"/>
  </g>

  <!-- Schnauzbart schwarz gefüllt: breit und kräftig wie ein Chevron, frei
       stehend, damit er nicht mit der Kinnkontur verschmilzt -->
  <path d="M33.5 68 C33.5 63.5 40.8 61.8 50 63.6 C59.2 61.8 66.5 63.5 66.5 68 L66 71.4 C65.8 73 64.4 73.3 63.4 72 C60.8 69.6 55.9 68.4 50 68.8 C44.1 68.4 39.2 69.6 36.6 72 C35.6 73.3 34.2 73 34 71.4 Z" fill="#000" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
</svg>
