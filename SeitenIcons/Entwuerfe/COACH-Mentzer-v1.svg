<svg width="100%" height="100%" viewBox="-3 -6 106 106" xmlns="http://www.w3.org/2000/svg">
  <!-- Entwurf: Coach als Sticker nach Mike Mentzer: kurzes, dunkles,
       gekämmtes Haar mit Seitenscheitel, große Pilotenbrille,
       dichter Schnauzbart, breiter Nacken mit Trapez, rosa T-Shirt.
       Erst die schwarze Außenkontur aus denselben Formen, darüber die
       Farbflächen. -->
  <defs>
    <path id="koerper" d="M36 70 C35 76 33 80 28 83 C20 86 12 89 6 95 L6 100 L94 100 L94 95 C88 89 80 86 72 83 C67 80 65 76 64 70 Z"/>
    <path id="gesicht" d="M28 30 L28 58 C28 71 38 80 50 80 C62 80 72 71 72 58 L72 30 Z"/>
    <path id="haare" d="M22 50 C20 40 20.5 27 28 18 C33 8.5 45 5 56 6.5 C68 7.5 79 16 79.5 30 C79.8 37 79 44 78 50 L72 50 L72 38 C66 33 57 30 48 29.5 C41 29.2 35 30.5 31 33 C29.6 33.8 28.6 35 28 36.5 L28 50 Z"/>
  </defs>
  <g fill="#000" stroke="#000" stroke-width="13" stroke-linejoin="round">
    <use href="#koerper"/>
    <circle cx="26" cy="54" r="6"/>
    <circle cx="74" cy="54" r="6"/>
    <use href="#gesicht"/>
    <use href="#haare"/>
  </g>

  <!-- Nacken und Trapez, T-Shirt mit Rundhals in CAPBOY-Rosa (wie das Nautilus-Shirt) -->
  <use href="#koerper" fill="#E39A70"/>
  <path d="M6 95 C12 89 20 86 28 84 C33 90.5 67 90.5 72 84 C80 86 88 89 94 95 L94 100 L6 100 Z" fill="#FF69AE"/>
  <path d="M28 84 C33 90.5 67 90.5 72 84" fill="none" stroke="#D94F92" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M38 76 C45 81 55 81 62 76 L62 70 L38 70 Z" fill="#C97F58"/>

  <!-- Ohren und Gesicht -->
  <circle cx="26" cy="54" r="6" fill="#E39A70"/>
  <circle cx="74" cy="54" r="6" fill="#E39A70"/>
  <use href="#gesicht" fill="#ECA67C"/>

  <!-- Frisur: kurz, dunkel, gekämmt, Seitenscheitel -->
  <use href="#haare" fill="#24170C"/>
  <g fill="none" stroke="#3E2A18" stroke-width="2.4" stroke-linecap="round">
    <path d="M35.5 9.5 C32.5 15 31.5 21 31.5 26"/>
    <path d="M38 15 C48 11 61 13 71 21"/>
  </g>

  <!-- Brauen und Augen -->
  <path d="M34.5 42.5 L45 43.2" stroke="#21150B" stroke-width="4" stroke-linecap="round"/>
  <path d="M65.5 42.5 L55 43.2" stroke="#21150B" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="40" cy="51" rx="2.3" ry="2.7" fill="#1B120B"/>
  <ellipse cx="60" cy="51" rx="2.3" ry="2.7" fill="#1B120B"/>

  <!-- Große, eckige Pilotenbrille mit kräftigem Rand, leicht getönte Gläser -->
  <g stroke="#21150B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M30.5 46.5 C30.5 44.4 32 43.6 35 43.6 L46 43.6 C48.2 43.6 48.8 44.8 48.8 47 L48.4 53 C48 57 45.5 59 41.5 59 L37 59 C33 59 30.5 56.5 30.5 52.5 Z" fill="#FFF3DC" fill-opacity="0.4"/>
    <path d="M69.5 46.5 C69.5 44.4 68 43.6 65 43.6 L54 43.6 C51.8 43.6 51.2 44.8 51.2 47 L51.6 53 C52 57 54.5 59 58.5 59 L63 59 C67 59 69.5 56.5 69.5 52.5 Z" fill="#FFF3DC" fill-opacity="0.4"/>
    <path d="M45.5 43.6 L54.5 43.6" fill="none"/>
    <path d="M48.8 47.6 C49.6 46.6 50.4 46.6 51.2 47.6" fill="none"/>
    <path d="M30.5 45.5 L27.5 46" fill="none"/>
    <path d="M69.5 45.5 L72.5 46" fill="none"/>
  </g>

  <!-- Nase als Schatten -->
  <path d="M50 52 C48.5 56 47.5 58.5 49 60.5 L52.5 60.5" fill="none" stroke="#C97F58" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Dichter Schnauzbart, an den Enden leicht nach unten -->
  <path d="M31.5 71 C31.5 63.5 40 60.5 50 62.5 C60 60.5 68.5 63.5 68.5 71 C68.5 74.5 66 75.5 64 73 C61 69.8 56 68.8 50 69.3 C44 68.8 39 69.8 36 73 C34 75.5 31.5 74.5 31.5 71 Z" fill="#21150B"/>
</svg>
