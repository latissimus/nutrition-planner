<!doctype html>
<html lang="de" data-theme="retro">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="theme-color" content="#F2EBE0">
    <meta name="description" content="Ernährung, Training, Routinen und Schlaf planen.">
    <!-- YouTube benoetigt eine Herkunftskennung fuer eingebettete Player
         (Fehler 153). Diese Einstellung sendet sie nur bei HTTPS-Zielen und
         niemals den Pfad, Suchparameter oder Inhalte des aktuellen Dex. -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), magnetometer=(), gyroscope=()">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://world.openfoodfacts.org https://*.youtube.com https://*.youtube-nocookie.com https://*.tiktok.com https://*.instagram.com https://*.vimeo.com; img-src 'self' data: blob: https:; media-src 'self' blob: https://*.supabase.co; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://www.tiktok.com https://www.instagram.com https://player.vimeo.com; worker-src 'self' blob:; manifest-src 'self'">
    <meta name="application-name" content="MUSCLEDEX">
    <meta name="apple-mobile-web-app-title" content="MUSCLEDEX">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./muscledex-apple-touch-icon-v4.png">
    <link rel="icon" href="./muscledex-app-icon-v4.svg" type="image/svg+xml">
    <title>MUSCLEDEX</title>
  </head>
  <body>
    <div id="app"></div>
    <div class="ausrichtung-sperre" role="status" aria-live="polite">
      <strong>Bitte ins Hochformat drehen</strong>
      <span>MUSCLEDEX ist für die Bedienung im Hochformat optimiert.</span>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
